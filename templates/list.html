{{define "list.html"}}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {{if eq .Section "megan"}}<meta name="robots" content="noindex, nofollow, noarchive">{{end}}
    <title>{{.Title}}</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    {{template "header" .}}
    <main>
      <h1 class="page-heading">{{.Heading}}</h1>
      <section class="post-list" aria-label="{{.Heading}}">
        {{range .Articles}}
        <article class="post-preview">
          <time datetime="{{.Date}}">{{.Date}}</time>
          <h2><a href="{{.URL}}">{{.Title}}</a></h2>
        </article>
        {{else}}
        <p>{{.Empty}}</p>
        {{end}}
      </section>
    </main>
  </body>
</html>
{{end}}
