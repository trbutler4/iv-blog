<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Megan - IV</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <header class="site-header"><a class="site-title" href="/">IV</a></header>
    <main>
      <h1 class="page-heading">Megan</h1>
      <p>A little space just for you.</p>
      <form class="login-form" method="post" action="/megan/login">
        <input type="hidden" name="next" value="{{.Next}}">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus{{if .Error}} aria-describedby="login-error" aria-invalid="true"{{end}}>
        {{if .Error}}<p id="login-error" role="alert">{{.Error}}</p>{{end}}
        <button type="submit">Enter</button>
      </form>
    </main>
  </body>
</html>
